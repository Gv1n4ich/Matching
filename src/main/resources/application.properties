spring.application.name=devmatch

spring.datasource.url=jdbc:postgresql://localhost:5432/devmatch
spring.datasource.username=devmatch
spring.datasource.password=devmatch

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Logging
logging.level.org.flywaydb=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG